name: Sync DOSM CSVs

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1"  # every Monday 02:15 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest CSVs
        run: |
          set -e
          mkdir -p data

          curl -L --fail --retry 5 --retry-delay 5 \
            -o data/population_state.csv \
            "https://storage.dosm.gov.my/population/population_state.csv"

          curl -L --fail --retry 5 --retry-delay 5 \
            -o data/population_district.csv \
            "https://storage.dosm.gov.my/population/population_district.csv"

          curl -L --fail --retry 5 --retry-delay 5 \
            -o data/population_malaysia.csv \
            "https://storage.dosm.gov.my/population/population_malaysia.csv"

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/population_state.csv data/population_district.csv data/population_malaysia.csv
          git commit -m "chore: update DOSM population CSVs"
          git push
